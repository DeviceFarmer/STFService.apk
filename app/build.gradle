apply plugin: 'com.android.application'
apply plugin: 'com.google.protobuf'

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.10.0'
    }
}

android {
    compileSdk 36

    signingConfigs {
        debug {
            storeFile file('keys/debug.keystore')
            storePassword 'insecure-store-password'
            keyAlias 'STFDebugKey'
            keyPassword 'insecure-key-password'
        }
    }

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 30
        versionCode 17
        versionName "2.5.8"
        applicationId "jp.co.cyberagent.stf"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }

    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
    namespace 'jp.co.cyberagent.stf'
    buildFeatures {
        buildConfig true
    }
    lint {
        informational 'ExpiredTargetSdkVersion'
    }

}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.protobuf:protobuf-javalite:4.36.2'
    compileOnly fileTree(dir: '../shim/libs', include: ['*.jar'])
}

protobuf {
    protoc {
      artifact = "com.google.protobuf:protoc:4.36.2"
    }
    generateProtoTasks {
      all().each { task ->
        task.builtins {
          java {
            option 'lite'
          }
        }
      }
    }
}
